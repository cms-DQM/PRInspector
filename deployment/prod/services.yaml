kind: Service
apiVersion: v1
metadata:
  name: prinspector-app
  namespace: prinspector
  labels:
    app: prinspector-app
    app.kubernetes.io/component: prinspector-app
    app.kubernetes.io/instance: prinspector-app
    app.kubernetes.io/name: prinspector-app
    app.kubernetes.io/part-of: prinspector
    app.openshift.io/runtime-version: latest
spec:
  type: ClusterIP
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: prinspector-app
    deployment: prinspector-app

---
kind: Service
apiVersion: v1
metadata:
  name: nginx
  namespace: prinspector
  labels:
    app: nginx
    app.kubernetes.io/component: nginx
    app.kubernetes.io/instance: nginx
spec:
  ipFamilies:
    - IPv4
  ports:
    - name: 8080-tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: 8443-tcp
      protocol: TCP
      port: 8443
      targetPort: 8443
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    deployment: nginx
status:
  loadBalancer: {}
